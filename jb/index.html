<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>举报</title>
<meta name="description" content="滚木">
<link rel="icon" type="image/png" href="../data/backg.png">
<link rel="apple-touch-icon" href="../data/backg.png">
<link rel="stylesheet" href="../data/style.css">
</head>
<body>

<main class="wrap page">
    <div class="field">
        <label for="demo-name">姓名</label>
        <input class="input" id="demo-name" type="text" placeholder="姓名">
        <label for="id">身份证号</label>
        <input class="input" id="id" type="text" placeholder="输入身份证号">
    </div>

    <div class="field">
        <label for="demo-select">选择一项</label>
        <select class="select" id="demo-select">
        <option>请选择...</option>
        <option>色情低俗</option>
        <option>暴力恐怖</option>
        <option>涉政敏感</option>
        </select>
    </div>

    <div class="field">
        <label for="demo-text">详细信息</label>
        <textarea class="textarea" id="demo-text" placeholder="写点什么"></textarea>
    </div>

    <label class="check">
        <input type="checkbox">
        我保证内容真实
    </label>
</main>
</body>
</html>
