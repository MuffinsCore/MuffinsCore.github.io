<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>查</title>
<style>
:root{
  --bg:#0b0d12;
  --text:#e6e8ee;
  --body:#cfd5e4;
  --muted:#8b93a7;
  --line:rgba(255,255,255,.09);
  --accent:#7c9cff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 620px at 12% -10%, rgba(124,156,255,.16), transparent 65%),
    radial-gradient(820px 600px at 100% 0%, rgba(192,132,252,.13), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
::selection{background:rgba(124,156,255,.35)}
.wrap{
  max-width:760px;
  margin:0 auto;
  padding:0 20px 60px;
}
/* ---------- 页头 ---------- */
.page-head{padding:40px 0 24px}
.page-head h1{
  margin:0 0 8px;
  font-size:clamp(1.8rem,5vw,2.4rem);
  line-height:1.2;
  letter-spacing:-.01em;
  font-weight:750;
  color:#e8ecff;
  background:linear-gradient(100deg,#e8ecff 8%,#a9b8ff 52%,#d8a8ff 94%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.page-head .sub{
  margin:0;
  color:var(--muted);
  font-size:.9rem;
}
/* ---------- 搜索框 ---------- */
.search-bar{
  position:relative;
  margin:0 0 16px;
}

.search-input{
  width:100%;
  padding:14px 48px 14px 18px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(0,0,0,.3);
  color:var(--text);
  font:inherit;
  font-size:1rem;
  -webkit-appearance:none;
  appearance:none;
  transition:border-color .2s, box-shadow .2s, background .2s;
}

.search-input::placeholder{color:#6f7789}

.search-input:focus{
  outline:none;
  border-color:rgba(124,156,255,.6);
  background:rgba(0,0,0,.4);
  box-shadow:0 0 0 3px rgba(124,156,255,.16);
}

.search-input::-webkit-search-cancel-button{display:none}

.search-clear{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  border-radius:8px;
  background:rgba(255,255,255,.08);
  color:#b8c0d4;
  font-size:.9rem;
  line-height:1;
  cursor:pointer;
  transition:background .2s, color .2s;
}

.search-clear:hover{background:rgba(255,255,255,.16); color:#fff}

/* ---------- 统计 / 空状态 ---------- */
.stat{
  margin:0 0 18px;
  color:var(--muted);
  font-size:.84rem;
}

.empty{
  margin:40px 0;
  padding:32px 20px;
  border:1px dashed rgba(255,255,255,.12);
  border-radius:14px;
  text-align:center;
  color:var(--muted);
  font-size:.92rem;
}

.empty strong{color:#b8c0d4;font-weight:600}

/* ---------- 卡片 ---------- */
.cards{display:grid; gap:16px}

.student-card{
  padding:20px 22px;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  box-shadow:0 14px 44px -26px rgba(0,0,0,.95);
  transition:border-color .25s, transform .25s, opacity .25s;
}

.student-card:hover{
  border-color:rgba(255,255,255,.17);
  transform:translateY(-2px);
}

/* 已转出：整体压暗 */
.student-card.is-out{opacity:.5}
.student-card.is-out:hover{opacity:.75}

.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}

.card-name{
  margin:0;
  font-size:1.75rem;
  font-weight:750;
  line-height:1.25;
  letter-spacing:.02em;
  color:#e8ecff;
  word-break:break-word;
}

/* ---------- 徽章 ---------- */
.badge{
  display:inline-flex;
  align-items:center;
  flex:0 0 auto;
  padding:4px 12px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:.78rem;
  font-weight:650;
  letter-spacing:.02em;
  line-height:1.5;
  white-space:nowrap;
}

.badge-gold{color:#fcd34d; background:rgba(251,191,36,.14); border-color:rgba(251,191,36,.40)}
.badge-green{color:#86efac; background:rgba(74,222,128,.12); border-color:rgba(74,222,128,.32)}
.badge-red{color:#fca5a5; background:rgba(248,113,113,.12); border-color:rgba(248,113,113,.32)}

/* ---------- 信息区 ---------- */
.card-info{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:10px 22px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.06);
}

.info-item{
  display:flex;
  gap:10px;
  font-size:.9rem;
  line-height:1.65;
}

.info-label{
  flex:0 0 auto;
  min-width:4.5em;
  color:var(--muted);
}

.info-value{
  color:var(--body);
  word-break:break-word;
}

/* ---------- 页脚 ---------- */
.page-foot{
  margin-top:44px;
  padding-top:20px;
  border-top:1px solid var(--line);
  color:#6f7789;
  font-size:.82rem;
  line-height:1.8;
}

/* ---------- 响应式 ---------- */
@media (max-width:640px){
  .wrap{padding:0 16px 48px}
  .page-head{padding:32px 0 20px}
  .student-card{padding:17px 17px}
  .card-name{font-size:1.45rem}
  .card-info{grid-template-columns:1fr; gap:8px}
  .card-top{gap:10px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="page-head">
    <h1>查</h1>
    <p class="sub">输入完整姓名（或拼音）后显示卡片</p>
  </header>
  <div class="search-bar">
    <input class="search-input" id="search" type="text"
           placeholder="输入完整姓名或拼音，例如：张欲晓 / zyx / zhang yu xiao"
           autocomplete="off" spellcheck="false">
    <button class="search-clear" id="clear" type="button" aria-label="清空" hidden>✕</button>
  </div>
  <p class="stat" id="stat"></p>
  <div class="cards" id="cards"></div>
  <p class="empty" id="empty"></p>
  <footer class="page-foot">
    <p>v0.2.2 最后编辑于2026年11月22日23:30</p>
    <p>查询需完全匹配姓名；也可用拼音全拼或首字母精确查询。</p>
  </footer>
</main>
<script>
const STUDENTS_CSV = `name,pinyin,status,commute,gender,sf,rank,hobby
张希乐,zhang xi le,founder,电动车,,学生,,
李文嵩,li wen song,founder,电动车,,学生,,
李宇涵,li yu han,founder,家长接送,,学生,,
王海博,wang hai bo,founder,电动车,,学生,,
陈柯绮,chen ke qi,founder,电动车,,学生,,
付合政,fu he zheng,founder,自行车,,学生,,
牛国旭,niu guo xu,founder,电动车,,学生,,
李金灿,li jin can,founder,步行,,学生,,
刘宇昌,liu yu chang,founder,家长接送,,学生,,
刘美硕,liu mei shuo,founder,电动车,,学生,,
袁新佑,yuan xin you,founder,电动车,,学生,,
王守润,wang shou run,founder,电动车,,学生,,
范泽正,fan ze zheng,founder,步行,,学生,,
高诗棋,gao shi qi,founder,电动车,,学生,,
李姿涵,li zi han,founder,电动车,,学生,,
卢雅琪,lu ya qi,founder,电动车,,学生,,
董家诚,dong jia cheng,founder,家长接送,,学生,,
田昊德,tian hao de,founder,电动车,,学生,,
王浩宇,wang hao yu,founder,电动车,,学生,,
徐辛雅,xu xin ya,founder,电动车,,学生,,
吴语萱,wu yu xuan,founder,步行,,学生,,
刘士哲,liu shi zhe,founder,电动车,,学生,,
朱哲宇,zhu zhe yu,founder,电动车,,班长,,
王之硕,wang zhi shuo,Out,,,学生,,
郭若涵,guo ruo han,founder,自行车,,学生,,
李保文,li bao wen,founder,电动车,,学生,,
王心悦,wang xin yue,founder,电动车,,学生,,
姜宇泽,jiang yu ze,founder,电动车,,学生,,
王锦溪,wang jin xi,founder,家长接送,,学生,,
赵沛林,zhao pei lin,founder,电动车,,学生,,
张民涛,zhang min tao,founder,步行,,学生,,
刘凡可,liu fan ke,founder,电动车,,学生,,
李梓萌,li zi meng,founder,电动车,,学生,,
李欣怡,li xin yi,founder,电动车,,学生,,
李祥屹,li xiang yi,founder,电动车,,学生,,
李齐麟,li qi lin,founder,步行,,学生,,
李宗涵,li zong han,founder,家长接送,,学生,,
刘瑾萱,liu jin xuan,founder,电动车,,学生,,
刘佳鑫,liu jia xin,founder,电动车,,学生,,
杨宗洁,yang zong jie,founder,步行,,学生,,
姜自轩,jiang zi xuan,founder,家长接送,,学生,,
杜沛文,du pei wen,founder,自行车,,学生,,
许梓墨,xu zi mo,founder,电动车,,学生,,
邱佳印,qiu jia yin,founder,电动车,,学生,,
赵婧琪,zhao jing qi,founder,自行车,,学生,,
孙悦彤,sun yue tong,founder,电动车,,学生,,
叶晁煊,ye chao xuan,founder,电动车,,学生,,
刘雨泽,liu yu ze,founder,电动车,,学生,,
付高艺,fu gao yi,founder,家长接送,,学生,,男娘
王先法,wang xian fa,founder,自行车,,学生,,
金佳卉,jin jia hui,founder,电动车,,学生,,
张欲晓,zhang yu xiao,In,未知,男,班主任，化学,,
樊林生,fan lin sheng,founder,丰田/自行车,男,班主任，物理,,
石步华,shi bu hua,founder,,女,语文,,
田晨,tian chen,founder,,女,英语,,
马艳华,ma yan hua,founder,,女,数学,,
庞雷,pang lei,founder,,女,生物,,
边富洋,bian fu yang,In,,男,历史,,
赵淑华,zhao shu hua,In,,女,地理,,
宋淑敬,song shu jing,In,,女,政治,,`;
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines.shift().split(',').map(s => s.trim());

  const EMPTY_KEYS = ['gender', 'sf', 'rank', 'hobby'];

  return lines.filter(line => line.trim()).map(line => {
    const cells = line.split(',').map(s => s.trim());
    const row = {};
    header.forEach((key, i) => {
      row[key] = cells[i] || '';
    });
    EMPTY_KEYS.forEach(key => {
      if (row[key] === undefined) row[key] = '';
    });
    return row;
  });
}
const STUDENTS = parseCSV(STUDENTS_CSV);
const FIELDS = [
  { key: 'commute', label: '上下学方式' },
  { key: 'gender',  label: '性别' },
  { key: 'sf',      label: '身份' },
  { key: 'rank',    label: '排名' },
  { key: 'hobby',   label: '备注' }
];
const STATUS = {
  founder:     { text: '创班成员', cls: 'badge-gold'  },
  In:  { text: '后来的',   cls: 'badge-green' },
  Out: { text: '已切割',   cls: 'badge-red'   }
};
(function () {
  var inputEl = document.getElementById('search');
  var clearEl = document.getElementById('clear');
  var cardsEl = document.getElementById('cards');
  var statEl  = document.getElementById('stat');
  var emptyEl = document.getElementById('empty');
  var NAME_KEY = 'name';
  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function normalize(s) {
    return String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
  }
  function pinyinForms(st) {
    var p = String(st.pinyin || '').trim().toLowerCase();
    if (!p) return [];
    var forms = [p.replace(/\s+/g, '')];   // 全拼：
    var parts = p.split(/\s+/).filter(Boolean);
    if (parts.length > 1) {
      forms.push(parts.map(function (x) { return x.charAt(0); }).join('')); // 首字母：
    }
    return forms;
  }
  function isMatch(st, q) {
    if (!q) return false;
    if (normalize(st[NAME_KEY]) === q) return true;
    return pinyinForms(st).some(function (f) { return f === q; });
  }
  function renderCard(st) {
    var statusKey = String(st.status || '').trim();
    var meta = STATUS[statusKey] || { text: statusKey || '未知', cls: 'badge-gold' };
    var infoHTML = FIELDS
      .filter(function (f) {
        var v = st[f.key];
        return v !== undefined && v !== null && v !== '';
      })
      .map(function (f) {
        return '<div class="info-item">' +
                 '<span class="info-label">' + esc(f.label) + '</span>' +
                 '<span class="info-value">' + esc(st[f.key]) + '</span>' +
               '</div>';
      })
      .join('');
    return '<article class="student-card' +
             (statusKey === 'Out' ? ' is-out' : '') + '">' +
             '<div class="card-top">' +
               '<h2 class="card-name">' + esc(st[NAME_KEY]) + '</h2>' +
               '<span class="badge ' + meta.cls + '">' + esc(meta.text) + '</span>' +
             '</div>' +
             (infoHTML ? '<div class="card-info">' + infoHTML + '</div>' : '') +
           '</article>';
  }
  function render() {
    var q = normalize(inputEl.value);
    clearEl.hidden = !inputEl.value;
    if (!q) {
      cardsEl.innerHTML = '';
      statEl.textContent = '';
      emptyEl.hidden = false;
      emptyEl.innerHTML = '请输入<strong>完整姓名</strong>后查看同学卡片。';
      return;
    }
    var list = STUDENTS.filter(function (s) { return isMatch(s, q); });
    if (list.length === 0) {
      cardsEl.innerHTML = '';
      statEl.textContent = '';
      emptyEl.hidden = false;
      emptyEl.innerHTML = '未找到完全匹配的同学。<br>请检查姓名是否完整准确，或换用拼音全拼 / 首字母';
      return;
    }
    emptyEl.hidden = true;
    statEl.textContent = '找到 ' + list.length + ' 位同学';
    cardsEl.innerHTML = list.map(renderCard).join('');
  }
  inputEl.addEventListener('input', render);
  clearEl.addEventListener('click', function () {
    inputEl.value = '';
    inputEl.focus();
    render();
  });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      inputEl.value = '';
      render();
    }
  });
  render();
})();
</script>
</body>
</html>
