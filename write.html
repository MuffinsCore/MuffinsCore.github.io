<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .write-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input[type="text"], .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .form-group textarea {
            height: 400px;
            resize: vertical;
        }

        .settings-group, .button-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .publish-button {
            background-color: #1890ff;
            color: white;
        }

        .cancel-button {
            background-color: #f5f5f5;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="fixed-nav">
        <div class="header">
            <div class="logo">.1</div>
            <div class="datetime-display">
                <div class="date" id="date"></div>
                <div class="time" id="time"></div>
            </div>
        </div>

        <div class="nav-menu">
            <div class="nav-links">
                <a href="dashboard.html">返回首页</a>
            </div>
            <a href="me.html" class="username" id="usernameDisplay"></a>
        </div>
    </div>

    <div class="write-container">
        <form id="articleForm">
            <div class="form-group">
                <label for="title">文章标题</label>
                <input type="text" id="title" required>
            </div>

            <div class="form-group">
                <label for="content">文章内容</label>
                <textarea id="content" required></textarea>
            </div>

            <div class="settings-group">
                <div class="settings-item">
                    <input type="checkbox" id="allowLikes" checked>
                    <label for="allowLikes">允许点赞</label>
                </div>
                <div class="settings-item">
                    <input type="checkbox" id="allowComments" checked>
                    <label for="allowComments">允许评论</label>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="button cancel-button" onclick="window.location.href='dashboard.html'">取消</button>
                <button type="submit" class="button publish-button">发布</button>
            </div>
        </form>
    </div>

    <script>
        // 检查登录状态
        window.onload = function() {
            const username = localStorage.getItem('username');
            if (!username) {
                window.location.href = '../index.html';
                return;
            }
            document.getElementById('usernameDisplay').textContent = username;
        };

        // 提交文章
        document.getElementById('articleForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const allowLikes = document.getElementById('allowLikes').checked;
            const allowComments = document.getElementById('allowComments').checked;
            
            try {
                const response = await fetch('/api/articles', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title,
                        content,
                        allowLikes,
                        allowComments,
                        username: localStorage.getItem('username')
                    })
                });

                if (response.ok) {
                    window.location.href = 'dashboard.html';
                } else {
                    alert('发布失败，请重试');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('发布过程出现错误，请稍后重试');
            }
        };
    </script>
</body>
</html>
