<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的展示页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      min-height: 100vh;
      background: #12141a;
      color: #e8eaf0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 880px;
      background: #1c1f27;
      border: 1px solid #2c313d;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 500;
      color: #9aa3b5;
      margin: 0 0 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card img,
    .card video {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #000;
    }

    .link-card {
      text-align: center;
    }

    .link-card a {
      display: inline-block;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: #0b0d12;
      background: #6ea8fe;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
      word-break: break-all;
    }

    .link-card a:hover,
    .link-card a:focus {
      background: #8fbcff;
      transform: translateY(-2px);
    }

    footer {
      font-size: 0.8rem;
      color: #6b7385;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>图片与视频展示</h1>

  <!-- 图片 -->
  <section class="card">
    <h2>图片</h2>
    <img src="1.jpg" alt="1.jpg 图片">
  </section>

  <!-- 视频 -->
  <section class="card">
    <h2>视频</h2>
    <video src="1.MP4" controls preload="metadata" playsinline>
      你的浏览器不支持 HTML5 视频播放。
      <a href="1.MP4">点击下载视频</a>
    </video>
  </section>

  <!-- 链接 -->
  <section class="card link-card">
    <h2>相关链接</h2>
    <a href="https://wushisanjiliuban.miraheze.org/" target="_blank" rel="noopener noreferrer">
      访问 wushisanjiliuban.miraheze.org
    </a>
  </section>

  <footer>© <span id="year"></span> 五十三级六班</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
