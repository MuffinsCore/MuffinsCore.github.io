<script>
(function () {
  var header = document.getElementById('site-header');
  if (!header) return;

  var root = document.documentElement;

  function syncHeight() {
    root.style.setProperty('--header-h', header.offsetHeight + 'px');
  }

  function onScroll() {
    header.classList.toggle('is-scrolled', window.scrollY > 8);
  }

  if (header.classList.contains('site-header--fixed')) {
    document.body.classList.add('has-fixed-header');
  }

  syncHeight();
  onScroll();

  window.addEventListener('resize', syncHeight);
  window.addEventListener('scroll', onScroll, { passive: true });
})();

</script>
<script>
(function () {
  var box = document.getElementById('gaokao-countdown');
  if (!box) return;

  var target = new Date('2029-06-07T09:00:00+08:00').getTime();
  var label = box.querySelector('.countdown-label');
  var els = {
    d: box.querySelector('[data-unit="d"]'),
    h: box.querySelector('[data-unit="h"]'),
    m: box.querySelector('[data-unit="m"]'),
    s: box.querySelector('[data-unit="s"]')
  };

  if (!els.d || !els.h || !els.m || !els.s) return;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var diff = target - Date.now();

    if (diff <= 0) {
      els.d.textContent = '0';
      els.h.textContent = '00';
      els.m.textContent = '00';
      els.s.textContent = '00';
      box.classList.add('is-over');
      if (label) label.textContent = '他们来了💀';
      clearInterval(timer);
      return;
    }

    var sec = Math.floor(diff / 1000);
    els.d.textContent = Math.floor(sec / 86400);
    els.h.textContent = pad(Math.floor(sec % 86400 / 3600));
    els.m.textContent = pad(Math.floor(sec % 3600 / 60));
    els.s.textContent = pad(sec % 60);
  }

  tick();
  var timer = setInterval(tick, 1000);

  // 从后台切回来时立刻刷新一次，避免看到过期数字
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });
})();
</script>
